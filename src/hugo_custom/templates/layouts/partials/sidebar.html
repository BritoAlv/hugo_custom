{{- $current := page.RelPermalink }}
<nav id="sidebar" class="sidebar" aria-label="Site navigation">
  <div class="sidebar-head">
    <span class="sidebar-title">{{ .Site.Title }}</span>
    <button id="sidebar-close" class="sidebar-close" type="button" aria-label="Close navigation">
      <svg class="icon icon-close" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <ul class="sidebar-menu">
    {{- range hugo.Data.sidebar.entries }}
      {{- partial "sidebar-item.html" (dict "entry" . "current" $current) }}
    {{- end }}
  </ul>
</nav>
