{{- if and (not page.IsHome) page.Ancestors }}
<nav class="breadcrumbs" aria-label="Breadcrumbs">
  <a href="{{ site.Home.RelPermalink }}">Home</a>
  {{- range page.Ancestors.Reverse }}
    {{- if not .IsHome }}<span class="sep">›</span><a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ end }}
  {{- end }}
  <span class="sep">›</span><span class="current">{{ page.Title }}</span>
</nav>
{{- end }}
