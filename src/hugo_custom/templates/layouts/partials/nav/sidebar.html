{{- $current := page.RelPermalink }}
<nav id="sidebar" class="sidebar" aria-label="Site navigation">
  <div class="sidebar-head">
    <span class="sidebar-title">{{ .Site.Title }}</span>
    <button id="sidebar-close" class="sidebar-close" type="button" aria-label="Close navigation">
      {{- partial "icon.html" (dict "name" "close" "class" "icon icon-close") }}
    </button>
  </div>
  <ul class="sidebar-menu">
    {{- range hugo.Data.sidebar.entries }}
      {{- partial "nav/sidebar-item.html" (dict "entry" . "current" $current) }}
    {{- end }}
  </ul>
</nav>
