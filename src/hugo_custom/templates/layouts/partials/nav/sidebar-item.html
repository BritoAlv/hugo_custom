{{- if .entry.section }}
<li class="sidebar-section">
  <button class="sidebar-section-toggle" type="button" aria-expanded="true">
    {{- partial "icon.html" (dict "name" "chevron" "class" "sidebar-arrow") }}
    <span class="sidebar-section-label">{{ .entry.section }}</span>
  </button>
  <ul class="sidebar-menu">
    {{- range .entry.contents }}
      {{- partial "nav/sidebar-item.html" (dict "entry" . "current" $.current) }}
    {{- end }}
  </ul>
</li>
{{- else }}
<li class="sidebar-item">
  <a href="{{ strings.TrimPrefix "/" .entry.href | relURL }}"{{ if eq (strings.TrimPrefix "/" .entry.href | relURL) $.current }} class="active"{{ end }}>
    {{- with .entry.icon }}<img class="sidebar-file-icon" src="{{ printf "icons/%s.svg" . | relURL }}" alt="" />{{ end }}
    <span class="menu-text">{{ .entry.text }}</span>
  </a>
</li>
{{- end }}
